<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wine Quality Predictor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="bg-gradient" aria-hidden="true"></div>

  <main class="container">
    <header class="hero">
      <div class="hero-icon" aria-hidden="true">🍷</div>
      <h1>Wine Quality Predictor</h1>
      <p class="subtitle">Şərabın fiziki-kimyəvi göstəricilərini daxil edin və keyfiyyət sinfini proqnozlaşdırın.</p>
    </header>

    <section class="card glass">
      <form id="wine-form" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="fixed_acidity">Fixed acidity</label>
            <input type="number" id="fixed_acidity" name="fixed_acidity" step="0.01" min="3" max="16" placeholder="7.4" required />
            <span class="hint">3.0 – 16.0</span>
            <span class="error-msg" data-for="fixed_acidity"></span>
          </div>

          <div class="field">
            <label for="volatile_acidity">Volatile acidity</label>
            <input type="number" id="volatile_acidity" name="volatile_acidity" step="0.001" min="0" max="2" placeholder="0.7" required />
            <span class="hint">0.0 – 2.0</span>
            <span class="error-msg" data-for="volatile_acidity"></span>
          </div>

          <div class="field">
            <label for="citric_acid">Citric acid</label>
            <input type="number" id="citric_acid" name="citric_acid" step="0.001" min="0" max="1.5" placeholder="0.0" required />
            <span class="hint">0.0 – 1.5</span>
            <span class="error-msg" data-for="citric_acid"></span>
          </div>

          <div class="field">
            <label for="residual_sugar">Residual sugar</label>
            <input type="number" id="residual_sugar" name="residual_sugar" step="0.1" min="0" max="70" placeholder="1.9" required />
            <span class="hint">0.0 – 70.0</span>
            <span class="error-msg" data-for="residual_sugar"></span>
          </div>

          <div class="field">
            <label for="chlorides">Chlorides</label>
            <input type="number" id="chlorides" name="chlorides" step="0.001" min="0" max="1" placeholder="0.076" required />
            <span class="hint">0.0 – 1.0</span>
            <span class="error-msg" data-for="chlorides"></span>
          </div>

          <div class="field">
            <label for="free_sulfur_dioxide">Free sulfur dioxide</label>
            <input type="number" id="free_sulfur_dioxide" name="free_sulfur_dioxide" step="0.1" min="0" max="350" placeholder="11" required />
            <span class="hint">0 – 350</span>
            <span class="error-msg" data-for="free_sulfur_dioxide"></span>
          </div>

          <div class="field">
            <label for="total_sulfur_dioxide">Total sulfur dioxide</label>
            <input type="number" id="total_sulfur_dioxide" name="total_sulfur_dioxide" step="0.1" min="0" max="450" placeholder="34" required />
            <span class="hint">0 – 450</span>
            <span class="error-msg" data-for="total_sulfur_dioxide"></span>
          </div>

          <div class="field">
            <label for="density">Density</label>
            <input type="number" id="density" name="density" step="0.0001" min="0.98" max="1.04" placeholder="0.9978" required />
            <span class="hint">0.98 – 1.04</span>
            <span class="error-msg" data-for="density"></span>
          </div>

          <div class="field">
            <label for="pH">pH</label>
            <input type="number" id="pH" name="pH" step="0.01" min="2.5" max="4.5" placeholder="3.51" required />
            <span class="hint">2.5 – 4.5</span>
            <span class="error-msg" data-for="pH"></span>
          </div>

          <div class="field">
            <label for="sulphates">Sulphates</label>
            <input type="number" id="sulphates" name="sulphates" step="0.01" min="0" max="2.5" placeholder="0.56" required />
            <span class="hint">0.0 – 2.5</span>
            <span class="error-msg" data-for="sulphates"></span>
          </div>

          <div class="field">
            <label for="alcohol">Alcohol</label>
            <input type="number" id="alcohol" name="alcohol" step="0.1" min="5" max="16" placeholder="9.4" required />
            <span class="hint">5.0 – 16.0</span>
            <span class="error-msg" data-for="alcohol"></span>
          </div>
        </div>

        <div class="actions">
          <button type="button" id="reset-btn" class="btn btn-secondary">Təmizlə</button>
          <button type="submit" id="predict-btn" class="btn btn-primary">
            <span class="btn-text">Predict</span>
            <span class="spinner" aria-hidden="true"></span>
          </button>
        </div>
      </form>
    </section>

    <section id="result-panel" class="card glass result-panel hidden" aria-live="polite">
      <h2>Nəticə</h2>
      <p id="result-text" class="result-text">Proqnoz: —</p>
      <p id="confidence-text" class="confidence-text"></p>
      <div id="prob-bars" class="prob-bars"></div>
    </section>

    <section id="error-panel" class="card glass error-panel hidden" role="alert">
      <p id="error-text"></p>
    </section>
  </main>

  <footer class="footer">
    <p>PyTorch + FastAPI · Wine Quality Dataset</p>
  </footer>

  <script src="/script.js"></script>
</body>
</html>
